name: verify

on:
  push:
  pull_request:

jobs:
  numbers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Check every printed number against the released tables
        run: python replication/verify_paper_numbers.py
      - name: Rebuild Figures 2-6
        run: make figures
